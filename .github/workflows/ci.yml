name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Biome check
        run: pnpm turbo run lint

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Typecheck (tsgo)
        run: pnpm turbo run typecheck

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Test (Vitest) with coverage
        run: pnpm turbo run test:coverage
      - name: Coverage summary
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          shopt -s nullglob
          {
            echo "## Test coverage"
            for report in packages/*/coverage/coverage.txt; do
              echo
              echo "### ${report%/coverage/coverage.txt}"
              echo '```'
              cat "$report"
              echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: packages/*/coverage/
          if-no-files-found: ignore

  fallow:
    name: fallow
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history for Fallow's churn/hotspot analysis.
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Fallow (dead code, unused exports and dependencies)
        run: pnpm turbo run fallow
