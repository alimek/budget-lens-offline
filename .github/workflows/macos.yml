name: macOS (self-hosted)

# Jobs on the self-hosted runner on the Mac Studio (#148, docs/ci.md#self-hosted-macos-runner).
# The repository is public: every job carries the fork guard below, so code from a fork PR never runs on the
# runner. Never add `pull_request_target`, secrets or write permissions to this workflow.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: macos-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  macos-typecheck:
    name: macos-typecheck
    # Fork guard: same-repo PRs and pushes to main only.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, aliclaw]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          isolated-store: "true"
      - name: Typecheck (TypeScript 7)
        run: pnpm turbo run typecheck

  macos-vitest:
    name: macos-vitest
    # Fork guard: same-repo PRs and pushes to main only.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, aliclaw]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          isolated-store: "true"
      - name: Test (Vitest)
        run: pnpm turbo run test

  ios-build:
    name: ios-build
    # Fork guard: same-repo PRs and pushes to main only.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, aliclaw]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select BudgetLens simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          # Only the dedicated BudgetLens-* simulators may be used; prefer BudgetLens-CI.
          devices="$(xcrun simctl list devices available | grep -E '^[[:space:]]+BudgetLens-[^ ]* \(' || true)"
          line="$(printf '%s\n' "$devices" | grep -E 'BudgetLens-CI \(' || true)"
          if [[ -z "$line" ]]; then
            line="$(printf '%s\n' "$devices" | head -n 1)"
          fi
          udid="$(printf '%s\n' "$line" | sed -nE 's/.*\(([0-9A-F-]{36})\).*/\1/p')"
          if [[ -z "$udid" ]]; then
            echo "::error title=ios-build::No BudgetLens-* simulator on the runner. Create one, e.g. 'xcrun simctl create BudgetLens-CI \"iPhone 16\"' (docs/ci.md)."
            exit 1
          fi
          name="$(printf '%s\n' "$line" | sed -nE 's/^[[:space:]]+(BudgetLens-[^ ]*) \(.*/\1/p')"
          echo "Using simulator $name ($udid)"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          xcodebuild -version

      - name: Detect app
        id: app
        shell: bash
        run: |
          if [[ -f apps/mobile/package.json ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=ios-build::apps/mobile does not exist yet (#109); the iOS build is skipped."
          fi

      - if: steps.app.outputs.exists == 'true'
        uses: ./.github/actions/setup
        with:
          isolated-store: "true"

      - name: Expo prebuild (iOS)
        if: steps.app.outputs.exists == 'true'
        working-directory: apps/mobile
        env:
          CI: "1"
        run: pnpm exec expo prebuild --platform ios --clean

      - name: Build for the BudgetLens simulator
        if: steps.app.outputs.exists == 'true'
        working-directory: apps/mobile/ios
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        shell: bash
        run: |
          set -euo pipefail
          workspace="$(find . -maxdepth 1 -name '*.xcworkspace' | head -n 1)"
          scheme="$(basename "$workspace" .xcworkspace)"
          xcodebuild \
            -workspace "$workspace" \
            -scheme "$scheme" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath "$RUNNER_TEMP/ios-derived-data" \
            CODE_SIGNING_ALLOWED=NO \
            build
