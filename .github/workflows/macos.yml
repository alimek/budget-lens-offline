name: macOS and iOS

# Typecheck, unit tests and the iOS simulator build on a GitHub-hosted macOS runner (#148, docs/ci.md#macos-jobs).
# Standard GitHub-hosted runners are free for public repositories.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: macos-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  macos-typecheck:
    name: macos-typecheck
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Typecheck (TypeScript 7)
        run: pnpm turbo run typecheck

  macos-vitest:
    name: macos-vitest
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Test (Vitest)
        run: pnpm turbo run test

  ios-build:
    name: ios-build
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Xcode version
        run: xcodebuild -version

      - name: Detect app
        id: app
        shell: bash
        run: |
          if [[ -f apps/mobile/package.json ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=ios-build::apps/mobile does not exist yet (#109); the iOS build is skipped."
          fi

      - if: steps.app.outputs.exists == 'true'
        uses: ./.github/actions/setup

      - name: Expo prebuild (iOS)
        if: steps.app.outputs.exists == 'true'
        working-directory: apps/mobile
        env:
          CI: "1"
        run: pnpm exec expo prebuild --platform ios --clean

      - name: Build for the iOS simulator
        if: steps.app.outputs.exists == 'true'
        working-directory: apps/mobile/ios
        shell: bash
        run: |
          set -euo pipefail
          workspace="$(find . -maxdepth 1 -name '*.xcworkspace' | head -n 1)"
          scheme="$(basename "$workspace" .xcworkspace)"
          xcodebuild \
            -workspace "$workspace" \
            -scheme "$scheme" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$RUNNER_TEMP/ios-derived-data" \
            CODE_SIGNING_ALLOWED=NO \
            build
