name: Setup
description: Install pnpm (version from packageManager) and Node.js (version from .nvmrc), then install dependencies.

runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@v6
      with:
        cache: true

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        # The pnpm store is already cached by pnpm/action-setup; disable setup-node's automatic cache.
        package-manager-cache: false

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
