name: Setup
description: Install pnpm (version from packageManager) and Node.js (version from .nvmrc), then install dependencies.

inputs:
  isolated-store:
    description: Use a per-job pnpm store and metadata cache under RUNNER_TEMP and skip the shared cache (self-hosted runner, docs/ci.md).
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Use per-job pnpm store and metadata cache
      if: inputs.isolated-store == 'true'
      shell: bash
      run: |
        echo "npm_config_store_dir=$RUNNER_TEMP/pnpm-store" >> "$GITHUB_ENV"
        echo "npm_config_cache_dir=$RUNNER_TEMP/pnpm-cache" >> "$GITHUB_ENV"

    - name: Setup pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        cache: ${{ inputs.isolated-store != 'true' }}
        # Per-job location: keeps pnpm inside the runner's work directory on the self-hosted runner (docs/ci.md).
        dest: ${{ runner.temp }}/setup-pnpm

    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        # Explicit: the pnpm store is cached only by pnpm/action-setup (setup-node auto-caches only npm).
        package-manager-cache: false

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
